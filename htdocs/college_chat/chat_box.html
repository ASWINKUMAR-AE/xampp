<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot | DRAWING WITH ASWIN</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        #chatBody {
            display: flex;
            flex-direction: column;
        }

        .chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #5bc0de;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
        }

        .chat-toggle svg {
            fill: white;
            width: 30px;
            height: 30px;
        }

        .floating-chat {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 350px;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: none;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s ease-in-out, transform 0.4s ease-out;
            z-index: 9999;
        }

        .chat-header {
            background-color: #333;
            color: #ffffff;
            padding: 15px;
            border-radius: 15px 15px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .chat-header strong {
            font-size: 16px;
        }

        .close-btn {
            font-size: 18px;
            cursor: pointer;
            color: white;
        }

        .chat-body {
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background-color: #2e2e2e;
            color: #ffffff;
        }

        .chat-footer {
            padding: 10px;
            background-color: #4aa6c6;
            border-radius: 0 0 15px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-footer input {
            flex-grow: 1;
            border: 1px solid #444;
            background-color: #2e2e2e;
            color: #ffffff;
            border-radius: 20px;
            padding: 10px;
            outline: none;
            font-size: 14px;
        }

        .chat-footer button {
            background-color: #0495c1;
            border: none;
            border-radius: 50%;
            padding: 10px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .chat-footer button:hover {
            background-color: #4aa6c6;
        }

        .chat-message {
            display: inline-block;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .chat-message.user {
            background-color: #5bc0de;
            color: white;
            display: inline-block;
            align-self: flex-end;
            margin-left: auto;
            margin-right: 0;
            text-align: right;
        }

        .chat-message.bot {
            background-color: #444;
            color: #ffffff;
            align-self: flex-start;
            margin-right: auto;
            text-align: left;
        }

        @media (max-width: 768px) {
            .floating-chat {
                width: 90%;
                right: 5px;
            }

            .chat-toggle {
                width: 50px;
                height: 50px;
            }

            .chat-toggle svg {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-toggle" id="chatToggle" onclick="toggleChat()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-chat-dots" viewBox="0 0 16 16">
            <path d="M3 0a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h1v2.982c0 .841.805 1.31 1.482.897l3.776-2.27H13a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3H3zm3 9.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3-1a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm2-1a1 1 0 1 0-2 0 1 1 0 0 0 2 0z" />
        </svg>
    </div>

    <div class="floating-chat" id="floatingChat">
        <div class="chat-header">
            <div>
                <img src="img/logo.jpg" alt="Bot Logo">
                <strong>Chat<span style="color: #5bc0de;">Bot</span></strong>
            </div>
            <span class="close-btn" onclick="closeChat(event)">×</span>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-message bot">
                Hello! How can I assist you today? 😊
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Type your message...">
            <button onclick="sendChatMessage()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" width="20" height="20" class="bi bi-send">
                    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        function toggleChat() {
            const chat = document.getElementById('floatingChat');
            const toggle = document.getElementById('chatToggle');
            if (chat.style.display === 'none' || chat.style.display === '') {
                chat.style.display = 'block';
                setTimeout(() => {
                    chat.style.opacity = '1';
                    chat.style.transform = 'scale(1)';
                }, 10);
                toggle.style.display = 'none';
            } else {
                chat.style.opacity = '0';
                chat.style.transform = 'scale(0)';
                setTimeout(() => {
                    chat.style.display = 'none';
                    toggle.style.display = 'flex';
                }, 300);
            }
        }

        function closeChat(event) {
            event.stopPropagation();
            toggleChat();
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (message) {
                const body = document.getElementById('chatBody');

                const userMessage = document.createElement('div');
                userMessage.className = 'chat-message user';
                userMessage.textContent = message;

                body.appendChild(userMessage);

                body.scrollTop = body.scrollHeight;

                input.value = '';

                setTimeout(() => {
                    const botMessage = document.createElement('div');
                    botMessage.className = 'chat-message bot';
                    botMessage.textContent = `You said: "${message}"! How else can I help?`;

                    body.appendChild(botMessage);

                    body.scrollTop = body.scrollHeight;
                }, 1000);
            }
        }
    </script>
</body>
</html>
