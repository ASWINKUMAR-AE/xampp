<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Bot | DRAWING WITH ASWIN</title>    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        .floating-chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            z-index: 9999;
            display: none;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s ease-in-out, transform 0.4s ease-out;
            /* box-shadow: 2px 2px 20px 3px black; */
        }
        
        .chat-body {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 10px;
            background-color: rgb(54, 49, 49);
            border-radius: 20px 20px 0px 0px !important;

        }

        .chat-message {
            max-width: 90%;
            padding: 10px;
            word-wrap: break-word;
            font-size: 14px;
            animation: expand 0.5s ease-in-out;
            border-radius: 15px;
            margin-bottom: 10px;
        }
.chat_head{
    border:none;
    background-color: #5bc0de !important;
}
        .chat-message.user {
            background-color: #5cb85c;
            color: white;
            align-self: flex-end;
            border-radius: 20px 20px 0 15px;
        }

        .chat-message.bot {
            background-color: #5bc0de;
            color: white;
            align-self: flex-start;
            border-radius: 20px 20px 15px 0;
        }

        .chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: center;
            cursor: pointer;
            padding: 12px;
            z-index: 9999;
            border-radius: 50px !important;
            width: 50px;
            height: 50px;
            animation: bounce 1s ;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .chat-toggle.hidden {
            opacity: 0;
            transform: scale(0.5);
        }

        .chat-toggle.show {
            opacity: 1;
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            cursor: pointer;
        }
        @keyframes expand { 
    0% { -webkit-transform: scale3d(1,0,1); opacity:1; }
    25% { -webkit-transform: scale3d(1,1.2,1); }
    50% { -webkit-transform: scale3d(1,0.85,1); }
    75% { -webkit-transform: scale3d(1,1.05,1); }
    100% { -webkit-transform: scale3d(1,1,1);  opacity:1; }
  }
  

  @keyframes bounce { 
    0% { -webkit-transform: translate3d(0,-25px,0); transform: translate3d(0,-25px,0); opacity:0; }
    25% { -webkit-transform: translate3d(0,10px,0); transform: translate3d(0,10px,0); }
    50% { -webkit-transform: translate3d(0,-6px,0); transform: translate3d(0,-6px,0); }
    75% { -webkit-transform: translate3d(0,2px,0); transform: translate3d(0,2px,0); }
    100% { -webkit-transform: translate3d(0,0,0); transform: translate3d(0,0,0); opacity: 1; }
  }
  div{
    border-radius: 20px !important; 
  }
    </style>
</head>
<body>
    <div class="chat-toggle btn btn-primary btn-circle chat-toggle hidden" id="chatToggle" onclick="toggleChat()" 
    style="display: flex; justify-content: center; align-items: center;">
   <span id="icon" style="font-size: 24px; text-align: center;">
       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-chat-dots" viewBox="0 0 16 16">
           <path d="M3 0a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h1v2.982c0 .841.805 1.31 1.482.897l3.776-2.27H13a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3H3zm3 9.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3-1a1 1 0 1 0-2 0 1 1 0 0 0 2 0zm2-1a1 1 0 1 0-2 0 1 1 0 0 0 2 0z"/>
       </svg>
   </span>
</div>

    <div class="floating-chat panel col-3 panel-default" data-aos="fade-up"  style="    background-color: #5bc0de !important;
">
        <div class="panel-heading text-center chat_head "style="border-radius: 20px !important; " onclick="toggleChat()">
            <strong><img src="img/logo.jpg" width="30" height="30" style="border-radius: 50px;"> ChatBot</strong>
            <span class="close-btn" onclick="closeChat()">×</span>
        </div>
        <div class="panel-body chat-body" id="chatBody">
            <div class="chat-message bot well well-sm bg-info text-info bot" data-aos="fade-right">
                <img src="img/logo.jpg" alt="Bot Logo" style="width: 20px; height: 20px; border-radius: 50%; margin-right: 10px;">Hello! I’m here to assist you. 😊
            </div>
            <div class="chat-message user well well-sm bg-success user text-success text-right" data-aos="fade-left">
                Hi there! Can you help me with something?
            </div>
        </div>
        <div class="panel-footer" style="border-radius: 0px 0px 20px 20px !important; background-color: #5bc0de; ">
            <div class="input-group">
                <input type="text" id="chatInput" class="form-control" placeholder="Type a message..." style="border-radius: 20px 0px 0px 20px; background-color: rgba(245, 242, 238, 0.864);">
                <span class="input-group-btn">
                    <button class="btn btn-primary" onclick="sendChatMessage()"  style="border-radius: 0px 20px 20px 0px; text-align: center; padding-top: 0px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16" style="position: relative; right: 5px;top:5px;">
                            <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/>
                          </svg>

                    </button>
                </span>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init();

        // Function to show the chat toggle button after page load
        window.onload = function () {
            const toggleButton = document.getElementById('chatToggle');
            toggleButton.classList.remove('hidden');
            toggleButton.classList.add('show');
        };

        function toggleChat() {
            const chatbox = document.querySelector('.floating-chat');
            const toggleButton = document.querySelector('.chat-toggle');
            if (chatbox.style.display === 'none' || chatbox.style.display === '') {
                chatbox.style.display = 'block';
                setTimeout(() => {
                    chatbox.style.opacity = '1';
                    chatbox.style.transform = 'scale(1)';
                }, 10);
                toggleButton.classList.add('hide');
                toggleButton.classList.remove('show');
            } else {
                chatbox.style.opacity = '0';
                chatbox.style.transform = 'scale(0)';
                setTimeout(() => {
                    chatbox.style.display = 'none';
                }, 300);
                toggleButton.classList.remove('hide');
                toggleButton.classList.add('show');
            }
        }

        function closeChat(event) {
            event.stopPropagation();
            const chatbox = document.querySelector('.floating-chat');
            const toggleButton = document.querySelector('.chat-toggle');
            chatbox.style.opacity = '0';
            chatbox.style.transform = 'scale(0)';
            setTimeout(() => {
                chatbox.style.display = 'none';
            }, 300);
            toggleButton.classList.remove('hide');
            toggleButton.classList.add('show');
        }

        function sendChatMessage() {
    const chatInput = document.getElementById('chatInput');
    const message = chatInput.value.trim();
    if (message) {
        const chatBody = document.getElementById('chatBody');
        
        // Create user message
        const userMessage = document.createElement('div');
        userMessage.className = 'chat-message user well well-sm bg-success text-success text-right';
        userMessage.textContent = message;
        chatBody.appendChild(userMessage);

        // Simulate bot response
        setTimeout(() => {
            const botMessage = document.createElement('div');
            botMessage.className = 'chat-message bot well well-sm bg-info text-info';
            botMessage.setAttribute('data-aos', 'fade-right');
            
            // Add bot logo and message
            botMessage.innerHTML = `
                <img src="img/logo.jpg" alt="Bot Logo" style="width: 20px; height: 20px; border-radius: 50%; margin-right: 10px;">
                Sure! How can I assist?
            `;
            
            chatBody.appendChild(botMessage);
            AOS.refresh();
        }, 1000);

        chatInput.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;
    }
}

    </script>
</body>
</html>
