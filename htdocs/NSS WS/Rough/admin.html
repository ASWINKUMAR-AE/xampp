.wrapper{

.wrapper .menu-btn{
  position: absolute;
  left: 20px;

  color: #fff;
  height: 45px;

}
#btn:checked ~ .menu-btn{

}
.wrapper .menu-btn i{
  position: absolute;
  transform: all;
  font-size: 23px;
  transition: all 0.3s ease;
}
.wrapper .menu-btn i.fa-times{
  opacity: 0;
}
#btn:checked ~ .menu-btn i.fa-times{
  opacity: 1;
  transform: rotate(-180deg);
}
#btn:checked ~ .menu-btn i.fa-bars{
  opacity: 0;
  transform: rotate(180deg);
}
