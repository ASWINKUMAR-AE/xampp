<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 PM Countdown Timer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @keyframes particleMovement {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            50% { transform: scale(1.5); }
            80% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0; }
        }
        
        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.3; }
            100% { transform: scale(10); opacity: 0; }
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: rgba(200, 200, 200, 0.7);
            border-radius: 50%;
            animation: particleMovement 8s linear infinite;
            filter: grayscale(100%) blur(0.5px);
            mix-blend-mode: screen;
        }
        
        .ripple {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px solid rgba(150, 150, 150, 0.3);
            border-radius: 50%;
            animation: ripple 6s linear infinite;
            filter: grayscale(100%);
        }
        
        .grid-line {
            position: absolute;
            background: rgba(100, 100, 100, 0.1);
            z-index: 1;
        }
        
        .horizontal-line {
            width: 100%;
            height: 1px;
            animation: moveHorizontal 20s linear infinite;
        }
        
        .vertical-line {
            width: 1px;
            height: 100%;
            animation: moveVertical 15s linear infinite;
        }
        
        @keyframes moveHorizontal {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }
        
        @keyframes moveVertical {
            0% { transform: translateX(-100vw); }
            100% { transform: translateX(100vw); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .timer-display {
                flex-direction: column;
                align-items: center;
                gap: 10px !important;
            }
            
            .time-unit {
                width: 100px !important;
                padding: 2rem 1rem !important;
            }
            
            .time-unit div:first-child {
                font-size: 3rem !important;
            }
            
            .separator {
                display: none;
            }
            
            h1 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem !important;
            }
            
            .main-heading {
                font-size: 1.8rem !important;
                margin-bottom: 0.5rem !important;
            }
        }

        @media (max-width: 576px) {
            .time-unit {
                width: 80px !important;
                padding: 1.5rem 0.5rem !important;
            }
            
            .time-unit div:first-child {
                font-size: 2.5rem !important;
            }
            
            .time-unit div:last-child {
                font-size: 0.7rem !important;
            }
            
            h1 {
                font-size: 1.2rem;
            }
            
            .main-heading {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body style="
    background-color: #121212;
    color: #e0e0e0;
    height: 100vh;
    overflow: hidden;
    position: relative;
">
    <!-- Background elements -->
    <div id="background-elements">
        <div id="grid-lines"></div>
        <div id="particles"></div>
        <div id="ripples"></div>
    </div>
    
    <div class="container d-flex flex-column justify-content-center align-items-center" style="height: 100%; position: relative; z-index: 10;">
        <h1 class="main-heading mb-1" style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase; font-size: 2.5rem;">ZET HUB OG WEBSITE</h1>
        <h1 class="mb-4" style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">Countdown to 3 PM</h1>
        
        <div class="timer-display d-flex justify-content-center" style="gap: 20px;">
            <div class="text-center">
                <div class="time-unit bg-dark rounded p-4" style="width: 120px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
                    <div id="hours" class="display-2 fw-bold" style="font-size: 4rem;">00</div>
                    <div class="text-uppercase mt-2" style="letter-spacing: 1px; font-size: 0.8rem;">Hours</div>
                </div>
            </div>
            <div class="text-center align-self-center separator" style="font-size: 3rem; margin-bottom: 30px;">:</div>
            <div class="text-center">
                <div class="time-unit bg-dark rounded p-4" style="width: 120px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
                    <div id="minutes" class="display-2 fw-bold" style="font-size: 4rem;">00</div>
                    <div class="text-uppercase mt-2" style="letter-spacing: 1px; font-size: 0.8rem;">Minutes</div>
                </div>
            </div>
            <div class="text-center align-self-center separator" style="font-size: 3rem; margin-bottom: 30px;">:</div>
            <div class="text-center">
                <div class="time-unit bg-dark rounded p-4" style="width: 120px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
                    <div id="seconds" class="display-2 fw-bold" style="font-size: 4rem;">00</div>
                    <div class="text-uppercase mt-2" style="letter-spacing: 1px; font-size: 0.8rem;">Seconds</div>
                </div>
            </div>
        </div>
        
        <div id="message" class="mt-5 text-center" style="font-size: 1.2rem; letter-spacing: 1px;"></div>
        <div id="redirect-message" class="mt-3 text-center" style="font-size: 1rem; letter-spacing: 1px; display: none;">
            Redirecting to <a href="https://zethub.in" style="color: #aaa; text-decoration: none;">ZET HUB</a> in <span id="redirect-countdown">5</span> seconds...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Create grid lines
        function createGridLines() {
            const container = document.getElementById('grid-lines');
            const lineCount = 20;
            
            for (let i = 0; i < lineCount; i++) {
                const horizontalLine = document.createElement('div');
                horizontalLine.classList.add('grid-line', 'horizontal-line');
                horizontalLine.style.top = `${(i / lineCount) * 100}vh`;
                horizontalLine.style.animationDelay = `${Math.random() * 5}s`;
                
                const verticalLine = document.createElement('div');
                verticalLine.classList.add('grid-line', 'vertical-line');
                verticalLine.style.left = `${(i / lineCount) * 100}vw`;
                verticalLine.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(horizontalLine);
                container.appendChild(verticalLine);
            }
        }
        
        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 80;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                // Random movement
                const tx = (Math.random() - 0.5) * 300;
                const ty = (Math.random() - 0.5) * 300;
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.animationDuration = `${8 + Math.random() * 12}s`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                
                container.appendChild(particle);
            }
        }
        
        // Create ripples
        function createRipples() {
            const container = document.getElementById('ripples');
            const rippleCount = 5;
            
            for (let i = 0; i < rippleCount; i++) {
                const ripple = document.createElement('div');
                ripple.classList.add('ripple');
                
                // Random position
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.style.animationDuration = `${6 + Math.random() * 6}s`;
                ripple.style.animationDelay = `${Math.random() * 6}s`;
                
                container.appendChild(ripple);
            }
        }
        
        // Initialize timer
        let redirectCountdown = 5;
        let redirectInterval;
        
        function updateTimer() {
            const now = new Date();
            let target = new Date();
            
            // Set target to 3 PM today
            target.setHours(15, 0, 0, 0);
            
            // If it's already past 3 PM, set target to 3 PM tomorrow
            if (now > target) {
                target.setDate(target.getDate() + 1);
            }
            
            const diff = target - now;
            
            // Calculate hours, minutes, seconds
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            // Update display
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            
            // Update message
            const message = document.getElementById('message');
            if (diff <= 0) {
                message.textContent = "It's 3 PM!";
                clearInterval(timerInterval);
                
                // Show redirect message and start countdown
                document.getElementById('redirect-message').style.display = 'block';
                redirectInterval = setInterval(() => {
                    redirectCountdown--;
                    document.getElementById('redirect-countdown').textContent = redirectCountdown;
                    
                    if (redirectCountdown <= 0) {
                        clearInterval(redirectInterval);
                        window.location.href = "https://zethub.in";
                    }
                }, 1000);
            } else if (hours === 0 && minutes < 30) {
                message.textContent = "3 PM is approaching soon!";
            } else {
                message.textContent = "Counting down to 3 PM today";
            }
        }
        
        // Initialize
        createGridLines();
        createParticles();
        createRipples();
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            document.getElementById('particles').innerHTML = '';
            document.getElementById('ripples').innerHTML = '';
            document.getElementById('grid-lines').innerHTML = '';

            createGridLines();
            createParticles();
            createRipples();
        });
    </script>
</body>
</html>
