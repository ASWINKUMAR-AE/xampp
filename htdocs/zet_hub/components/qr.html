<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Visiting Card</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .card {
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 320px;
      border: 1px solid #333;
    }
    
    h1 {
      color: #f5f5f5;
      margin-bottom: 24px;
      font-weight: 300;
      letter-spacing: 1px;
      font-size: 1.5rem;
    }
    
    .qr-container {
      padding: 20px;
      background-color: #2a2a2a;
      border-radius: 12px;
      margin: 0 auto;
      position: relative;
      display: inline-block;
    }
    
    .qr-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid #444;
      border-radius: 8px;
      pointer-events: none;
    }
    
    .logo-overlay {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .logo-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .footer {
      margin-top: 24px;
      font-size: 14px;
      color: #aaa;
      letter-spacing: 0.5px;
      font-weight: 300;
    }
    
    .qr-code-wrapper {
      position: relative;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Digital Visiting Card</h1>
    
    <div class="qr-code-wrapper">
      <div class="qr-container">
        <div class="qr-frame"></div>
        <canvas id="qr-code"></canvas>
        <div class="logo-overlay">
   
        </div>
      </div>
    </div>
    
    <p class="footer">zethub.in</p>
  </div>

  <!-- QRious Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <script>
    // Create the QR code with custom styling
    const qr = new QRious({
      element: document.getElementById('qr-code'),
      value: 'https://zethub.in/',
      size: 220,
      level: 'H',
      background: '#2a2a2a',
      foreground: '#f0f0f0',
      backgroundAlpha: 0,
      foregroundAlpha: 1
    });
    
    // Make the QR code slightly interactive
    const qrCanvas = document.getElementById('qr-code');
    qrCanvas.style.transition = 'all 0.3s ease';
    qrCanvas.addEventListener('mouseenter', function() {
      this.style.opacity = '0.95';
    });
    qrCanvas.addEventListener('mouseleave', function() {
      this.style.opacity = '1';
    });

    // Fallback if logo doesn't load
    document.getElementById('logo-image').onerror = function() {
      this.style.display = 'none';
      const fallback = document.createElement('div');
      fallback.textContent = 'Z';
      fallback.style.fontSize = '28px';
      fallback.style.fontWeight = 'bold';
      fallback.style.color = '#ddd';
      this.parentNode.appendChild(fallback);
    };
  </script>
</body>
</html>
